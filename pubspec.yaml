name: reparacion_estibas
description: "Aplicación para registro y gestión de reparación de estibas en planta."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  pdf: ^3.10.8
  printing: ^5.13.1
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  local_auth: ^2.2.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  signature: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/Estibas.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/icon/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_logo.png